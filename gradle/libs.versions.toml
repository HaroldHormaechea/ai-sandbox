# Centralised dependency versions for the :server and :android subprojects.
#
# Pinned at UC03 scaffold time (2026-05-16) and UC04 scaffold time
# (2026-05-17). "Latest" is a scaffold-time decision, not a runtime mandate —
# upgrades are an explicit follow-up project, never a side-effect of feature
# work (per profile-java-server-architecture § "Version handling on
# subsequent runs").
#
# Deviations from the approved proposal:
#   * springdoc-openapi 3.0.3 (proposal pinned 2.7.0).
#     Rationale: springdoc 2.x is Boot-3 / Spring Framework 6 / Jakarta EE 10.
#     Boot 4.0.6 ships Spring Framework 7 / Jakarta EE 11, which is incompatible
#     with springdoc 2.x. springdoc 3.0.3 has spring-boot-starter-parent 4.0.5
#     as its POM parent and is the natural fix; AC23 (committed OAS + drift
#     check) is preserved unchanged. No escalation needed per the contract.

[versions]
java               = "21"
springBoot         = "4.0.6"
springDepMgmt      = "1.1.6"
springdoc          = "3.0.3"

bouncycastle       = "1.79"
pty4j              = "0.13.4"
logstashLogback    = "8.0"
picocli            = "4.7.6"
jacksonYaml        = "2.18.2"

# Test-only — fully owned by QA; pinned here so the version catalog is the
# single source of truth.
junit              = "5.11.4"
mockito            = "5.14.2"
assertj            = "3.26.3"
archunit           = "1.3.0"
awaitility         = "4.2.2"
testcontainers     = "1.20.4"

spotless           = "7.0.0.BETA4"

# ── Android / Kotlin / Compose (UC04) ────────────────────────────────────────
# All pinned at UC04 scaffold time (2026-05-17). Per profile-java-server-
# architecture § "Version handling on subsequent runs", these are not a
# trigger to upgrade mid-feature.
androidGradle      = "9.2.1"
kotlin             = "2.3.21"
ksp                = "2.3.21-2.0.4"

# Compose Compiler is bundled with Kotlin 2.x; the Compose plugin pins it.
composeBom         = "2026.05.00"
composeAdaptive    = "1.2.0"
composeAdaptiveNav = "1.4.0"

androidxActivity         = "1.12.4"
androidxCoreKtx          = "1.18.0"
androidxLifecycle        = "2.10.0"
androidxNavCompose       = "2.9.8"
androidxFragment         = "1.8.9"
androidxWindow           = "1.5.1"
androidxDatastore        = "1.2.1"
androidxSecurityCrypto   = "1.1.0"
androidxAppcompat        = "1.7.0"

cameraX                  = "1.6.1"
zxingCore                = "3.5.4"

okhttp                   = "5.3.2"
kotlinxCoroutines        = "1.10.1"
kotlinxSerializationJson = "1.7.3"

# Android-side tests (QA scope; pinned here as the single source of truth).
androidTestRunner        = "1.7.1"
androidTestEspressoCore  = "3.7.1"
androidTestJunit         = "1.3.0"
robolectric              = "4.14.1"

# minSdk pinned to 29 per UC04 AC1; compileSdk/targetSdk tracks the
# latest stable platform Google publishes. AGP 9.x requires
# compileSdk >= 36 (Android 16) for forward compatibility.
androidMinSdk      = "29"
androidCompileSdk  = "36"
androidTargetSdk   = "36"

[libraries]
# Spring Boot — managed by the BOM the plugin applies; explicit modules
# below intentionally omit versions.
spring-boot-starter-webflux          = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-validation       = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator         = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-logging          = { module = "org.springframework.boot:spring-boot-starter-logging" }
spring-boot-configuration-processor  = { module = "org.springframework.boot:spring-boot-configuration-processor" }

# Reactor / Netty — pulled by the WebFlux starter, exposed here for
# explicit references (channel handlers, SslContext builders).
netty-handler                        = { module = "io.netty:netty-handler" }
netty-codec-http2                    = { module = "io.netty:netty-codec-http2" }

# springdoc + Swagger UI.
springdoc-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }

# Crypto.
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

# PTY (for `docker exec -it` interactive tmux attach in TmuxBridgeService).
pty4j = { module = "org.jetbrains.pty4j:pty4j", version.ref = "pty4j" }

# Structured logging (JSON Lines) for the audit appender.
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashLogback" }

# YAML config for sample-config.yaml round-trip in PkiInitCommand.
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jacksonYaml" }

# picocli — aisandboxctl CLI.
picocli              = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-codegen      = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }

# ArchUnit — owned by QA, declared here as a testImplementation entry.
archunit-junit5      = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# Awaitility — owned by QA.
awaitility           = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

# Testcontainers — owned by QA.
testcontainers-core  = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

# Test framework — owned by QA.
junit-bom            = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter        = { module = "org.junit.jupiter:junit-jupiter" }
spring-boot-starter-test  = { module = "org.springframework.boot:spring-boot-starter-test" }
reactor-test         = { module = "io.projectreactor:reactor-test" }
mockito-core         = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit        = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core         = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# ── Android (UC04) ───────────────────────────────────────────────────────────
# Compose BOM controls every Compose artifact version transitively; only
# the BOM is pinned. Non-Compose AndroidX artifacts are pinned individually.
androidx-compose-bom            = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui             = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics    = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling     = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
androidx-compose-foundation     = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3      = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-runtime        = { module = "androidx.compose.runtime:runtime" }
androidx-compose-animation      = { module = "androidx.compose.animation:animation" }

androidx-compose-material3-adaptive            = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "composeAdaptive" }
androidx-compose-material3-adaptive-layout     = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "composeAdaptive" }
androidx-compose-material3-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "composeAdaptive" }
androidx-compose-material3-adaptive-nav-suite  = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "composeAdaptiveNav" }

androidx-activity-compose       = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx               = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-fragment-ktx           = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
androidx-appcompat              = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }

androidx-lifecycle-runtime-ktx  = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-service      = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidxLifecycle" }

androidx-navigation-compose     = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavCompose" }

androidx-window                 = { module = "androidx.window:window", version.ref = "androidxWindow" }

androidx-datastore-preferences  = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }

androidx-security-crypto        = { module = "androidx.security:security-crypto", version.ref = "androidxSecurityCrypto" }

androidx-camera-core            = { module = "androidx.camera:camera-core", version.ref = "cameraX" }
androidx-camera-camera2         = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle       = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view            = { module = "androidx.camera:camera-view", version.ref = "cameraX" }

zxing-core                      = { module = "com.google.zxing:core", version.ref = "zxingCore" }

okhttp                          = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-tls                      = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }

kotlinx-coroutines-android      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json      = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Android tests (QA scope).
androidx-test-runner            = { module = "androidx.test:runner", version.ref = "androidTestRunner" }
androidx-test-espresso-core     = { module = "androidx.test.espresso:espresso-core", version.ref = "androidTestEspressoCore" }
androidx-test-ext-junit         = { module = "androidx.test.ext:junit", version.ref = "androidTestJunit" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
robolectric                     = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
spring-boot          = { id = "org.springframework.boot",                version.ref = "springBoot" }
spring-dep-mgmt      = { id = "io.spring.dependency-management",         version.ref = "springDepMgmt" }
spotless             = { id = "com.diffplug.spotless",                   version.ref = "spotless" }

# UC04 — Android.
android-application  = { id = "com.android.application",                 version.ref = "androidGradle" }
android-library      = { id = "com.android.library",                     version.ref = "androidGradle" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",            version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",     version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                 version.ref = "ksp" }
