services:
  claude-sandbox:
    build:
      context: .
      dockerfile: SandboxDockerfile
      # UC-27 — no toolchain build args. The base is a single glibc (Debian)
      # image for every session and toolchains are provisioned eagerly at spawn,
      # so there is nothing flavour-specific to pass at build time anymore.
    image: ai-context:latest
    # UC-17 — run the session container as the host's runtime user so the
    # bind-mounted, server-owned tree (secrets, claude-config, workspace) is
    # readable/writable. In install mode the management server injects
    # AI_SANDBOX_RUN_AS_USER=<secrets-owner-uid>:0 (gid pinned to 0, the
    # OpenShift arbitrary-uid recipe) via ScriptExecutorService#composeEnv.
    # Developer-mode runs leave it unset → defaults to the image's `claude`
    # user, which is byte-identical to the pre-UC-17 behaviour.
    user: "${AI_SANDBOX_RUN_AS_USER:-claude}"
    stdin_open: true
    tty: true
    environment:
      # UC-27 — the space-separated list of devtool capabilities the operator
      # selected (e.g. "android dind java"), exported by spawn.sh's
      # inject_devtool_spawn_env from the persisted ledger. entrypoint.sh reads
      # this, sources each capability's manifest under /opt/ai-sandbox/devtools.d/,
      # and runs its devtool_provision hook BEFORE launching tmux/claude so the
      # session is ready at handover. Unset/empty → no provisioning → a session
      # byte-identical to the no-capability default (AC#12). The dind/kvm
      # overrides still layer their own capability-specific env on top.
      AI_SANDBOX_DEVTOOLS: "${AI_SANDBOX_DEVTOOLS:-}"
    labels:
      # Optional, free-form label set by ./spawn.sh --label <value>.
      # Read back by ./attach.sh and (in UC03) the management REST API.
      com.ai-sandbox.label: "${AI_SANDBOX_LABEL:-}"
    volumes:
      # Local workspace — clone your projects here on the host
      # and they'll be available inside the container.
      #
      # Shared by default (`./workspace`). spawn.sh / spawn.ps1 can override
      # AI_SANDBOX_WORKSPACE_HOST_PATH to a per-session folder (e.g.
      # ./workspace-3) to give a session an isolated workspace.
      - "${AI_SANDBOX_WORKSPACE_HOST_PATH:-./workspace}:/workspace"
      # Secrets folder — contains the SSH key (git-key) and, optionally,
      # a gh token (gh-token) generated by the setup walkthrough.
      # Always shared, always read-only.
      #
      # UC05 § AC27 — the management server overrides via
      # AI_SANDBOX_SECRETS_HOST_PATH so the bind-source resolves to
      # /etc/ai-sandbox-server/secrets/ when running under systemd, while
      # developer-mode runs keep the historical `./secrets` default.
      - "${AI_SANDBOX_SECRETS_HOST_PATH:-./secrets}:/etc/secrets:ro"
      # Persist Claude's auth/config across container restarts so
      # you only need to /login once.
      #
      # Shared by default (`./claude-config`). spawn.sh / spawn.ps1 can
      # override AI_SANDBOX_CLAUDE_CONFIG_HOST_PATH to a per-session folder
      # (e.g. ./claude-config-3) to give a session an isolated Claude config.
      - "${AI_SANDBOX_CLAUDE_CONFIG_HOST_PATH:-./claude-config}:/home/claude/.claude"
      # UC-91 — per-session transcript store. Claude writes conversation
      # transcripts to ~/.claude/projects/<cwd-slug>/. When claude-config is
      # SHARED (the default), every session's transcripts co-resolve in the same
      # slug dir, so one session's chat bleeds into another on session→session
      # switch (and agent pills resolve to the wrong session). Nesting a
      # per-session bind at .../projects isolates the transcript store regardless
      # of the claude-config sharing mode. Compose mounts by destination depth
      # (parent .../.claude first, then .../.claude/projects), so this overlays
      # cleanly on top of the claude-config mount above. spawn.sh sets
      # AI_SANDBOX_CLAUDE_PROJECTS_HOST_PATH to ./claude-projects-<N>.
      - "${AI_SANDBOX_CLAUDE_PROJECTS_HOST_PATH:-./claude-projects}:/home/claude/.claude/projects"
      # Claude pre-init template — read-only seed material captured by
      # `aisandboxctl secrets seed` (UC06 step d). entrypoint.sh copies
      # this dir into ~/.claude/ exactly once per session (gated by
      # ~/.claude/.seeded) so new sessions inherit the operator's
      # pre-init OAuth state.
      #
      # On developer-mode hosts the default points at the in-repo
      # `./templates/claude-config/` (usually empty — the mount becomes
      # a no-op when the dir doesn't exist or holds only `.gitkeep`).
      # Under systemd, the management server overrides via
      # AI_SANDBOX_CLAUDE_TEMPLATE_HOST_PATH so the bind-source
      # resolves to /etc/ai-sandbox-server/templates/claude-config/.
      - "${AI_SANDBOX_CLAUDE_TEMPLATE_HOST_PATH:-./templates/claude-config}:/etc/claude-template:ro"
