org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false

# Bootstrap-friendly: fail fast if the JDK toolchain isn't discoverable.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true

# Surface the configured Boot version in CI logs.
# Default for non-release builds; the server-release workflow overrides
# this with -Pai_sandbox_server_version=<tag> when building from a
# `server-v*` git tag, so the released artifact carries the tag's version
# in its manifest / .deb / release zip. UC11 bumps this marker to track
# the working branch for the v0.0.12 release.
ai_sandbox_server_version=0.0.12-SNAPSHOT
