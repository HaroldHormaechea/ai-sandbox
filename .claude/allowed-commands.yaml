# Bash command prefixes the dev-team is allowed to run for this project.
# Each entry maps to a Bash(<prefix>:*) permission rule, granted by the
# develop skill's Step 3a before agents are spawned.
#
# Aligned with PROJECT_BRIEF.md `stack` and `build.commands`:
#   stack.languages = [Bash, PowerShell, Dockerfile]
#   build.tool      = docker compose
commands:
  - git
  - docker
  - ssh-keygen
  - chmod
  - curl
  - tar
  # UC02 — `enumerate_ai_sandbox_sessions` parses `docker compose ls --format json`.
  - jq
  # UC02 — operator scripts are POSIX shell + PowerShell; lint the .sh side.
  - shellcheck
  # UC02 — spawn pre-creates per-session host dirs; clean removes them.
  - mkdir
  - rm
  - rmdir
  - mv
  - cp
  - cat
  - awk
  - sed
  - tr
  - head
  - tail
  - grep
  - rg
  - find
  - bash
  - pwsh
  # UC03 — Java/Gradle management server build + PKI tooling.
  # UC-42 — the `./gradlew` prefix already covers the spotless lint gate
  # (`./gradlew :server:spotlessApply` / `:server:spotlessCheck`, the brief's
  # build.commands.format/lint) and `:server:test`; no separate entry needed.
  - ./gradlew
  - java
  - javac
  - jar
  - keytool
  - openssl
  - xxd
  - unzip
  - zip
  # UC04/UC18 — Android client: SDK + emulator tooling for building and
  # running instrumented Compose tests (./gradlew :android:connectedDebugAndroidTest).
  - adb
  - emulator
  - sdkmanager
  - avdmanager
  # UC-37 — the structured-conversation transcript-tail helper
  # (container-bin/aisandbox-conversation-tail) is a Node script; `node --check`
  # and functional smoke-tests of the helper need node on PATH.
  - node
  # UC-40 — the helper's regression suite runs via `npm test` (= `node --test`)
  # from container-bin/.
  - npm
  # UC-44 — the conversation keystroke-injection hard gate must be live-verified
  # against a real Claude Code TUI: bring up rootless DinD, build + spawn a session,
  # and drive/observe its tmux pane via `docker compose -p ai-sandbox-<n> exec`.
  - aisandbox-dind
  # UC-82 — QA runs the MCP add-dialog instrumented test on the KVM emulator
  # (`:android:connectedDebugAndroidTest`); the helper boots/queries the AVD.
  - aisandbox-emulator
  - ./setup.sh
  - ./spawn.sh
  - ./attach.sh
  - ./clean.sh
