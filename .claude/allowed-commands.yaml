# Bash command prefixes the dev-team is allowed to run for this project.
# Each entry maps to a Bash(<prefix>:*) permission rule, granted by the
# develop skill's Step 3a before agents are spawned.
#
# Aligned with PROJECT_BRIEF.md `stack` and `build.commands`:
#   stack.languages = [Bash, PowerShell, Dockerfile]
#   build.tool      = docker compose
commands:
  - git
  - docker
  - ssh-keygen
  - chmod
  - curl
  - tar
  # UC02 — `enumerate_ai_sandbox_sessions` parses `docker compose ls --format json`.
  - jq
  # UC02 — operator scripts are POSIX shell + PowerShell; lint the .sh side.
  - shellcheck
  # UC02 — spawn pre-creates per-session host dirs; clean removes them.
  - mkdir
  - rm
  - rmdir
  - mv
  - cp
  - cat
  - awk
  - sed
  - tr
  - head
  - tail
  - grep
  - rg
  - find
  - bash
  - pwsh
  # UC03 — Java/Gradle management server build + PKI tooling.
  - ./gradlew
  - java
  - javac
  - jar
  - keytool
  - openssl
  - xxd
  - unzip
  - zip
  # UC04/UC18 — Android client: SDK + emulator tooling for building and
  # running instrumented Compose tests (./gradlew :android:connectedDebugAndroidTest).
  - adb
  - emulator
  - sdkmanager
  - avdmanager
  # UC-37 — the structured-conversation transcript-tail helper
  # (container-bin/aisandbox-conversation-tail) is a Node script; `node --check`
  # and functional smoke-tests of the helper need node on PATH.
  - node
