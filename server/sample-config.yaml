# /etc/ai-sandbox-server/config.yaml — annotated reference.
#
# Every key has a sensible default baked into the fat jar (see
# server/src/main/resources/application.yaml). Uncomment to override.
#
# Reload semantics:
#   * cert + allowlist directories         → hot-reloaded via filesystem watch
#   * everything else                      → restart-only (systemctl restart)

ai-sandbox:
  server:

    tls:
      # Listen port for both REST/HTTPS (HTTP/1.1) and WebSocket upgrades.
      # v0.0.6 ships HTTP/1.1 only; HTTP/2 is deferred to v0.0.7 alongside
      # the mTLS-over-H2 architectural work. See the v0.0.6 release commit
      # for the rationale.
      port: 12410
      # Bind interface. "0.0.0.0" listens on every IPv4 + IPv6 address; firewall
      # at the host level if exposure is not desired.
      bind-address: "0.0.0.0"

    pki:
      # Directory holding server.crt (0644) and server.key (0600).
      dir: /etc/ai-sandbox-server/pki

    clients:
      # Allowlist folder. Drop a *.crt per allowed client; the server picks
      # them up via fs-watch within 250 ms. Removing a file revokes the cert
      # and tears down any in-flight connection from that cert within 1 s.
      dir: /etc/ai-sandbox-server/clients

    hostscripts:
      # UC05 — repo-root where the bundled host scripts live. Set by
      # `aisandboxctl pki init`; matches the install-time path
      # /opt/ai-sandbox-server/host/. Operators never edit this.
      repo-root: /opt/ai-sandbox-server/host

    sessions:
      # UC05 § AC11,AC25 — per-session compose project-directory.
      # spawn.sh / clean.sh cd here before writing the counter file and
      # per-session workspace-N/ + claude-config-N/ subdirs. Read-write
      # for the systemd unit (ReadWritePaths).
      host-state-root: /var/lib/ai-sandbox-server/sessions

    secrets:
      # UC05 § AC14,AC27 — operator-populated secrets dir bind-mounted
      # read-only into each sandbox container at /etc/secrets. SSH keys
      # and an optional gh-token live here; mode 0700 enforced by
      # `aisandboxctl pki init`.
      dir: /etc/ai-sandbox-server/secrets

    server-ssh:
      # UC-62 — the always-on "SERVER SSH SESSION" row: a tmux login shell
      # on the management-server HOST itself (the server's own user + cwd),
      # NOT inside any sandbox container. It crosses the container trust
      # boundary by design (an accepted operator convenience). Set enabled
      # to false to remove the row + endpoint entirely.
      enabled: true
      # tmux base session name on the dedicated socket.
      session-name: ai-sandbox-server-ssh
      # Optional overrides (defaulted at runtime when omitted):
      #   socket-path : tmux server socket. Default <sessions.host-state-root>/server-ssh.sock
      #   shell       : login shell to launch. Default $SHELL, else /bin/bash
      #   workdir     : working dir for the shell. Default the server JVM cwd
      #   home        : UC-64 — HOME for the host tmux + login shell. Default
      #                 <sessions.host-state-root>/server-ssh-home. Redirected to
      #                 this writable path (inside the unit's ReadWritePaths) so
      #                 tmux/the shell don't hit the ProtectHome-hidden /home,
      #                 mirroring how DOCKER_CONFIG redirects Docker.
      # socket-path: /var/lib/ai-sandbox-server/sessions/server-ssh.sock
      # shell: /bin/bash
      # workdir: /var/lib/ai-sandbox-server
      # home: /var/lib/ai-sandbox-server/sessions/server-ssh-home

    limits:
      # Per-IP connection rate-limit (token bucket).
      per-ip-new-conn-per-window: 10
      per-ip-window-seconds: 10
      # Per-IP concurrent connections.
      per-ip-concurrent: 10
      # spawn.sh subprocess timeout (AC19 → 504 on trip).
      spawn-timeout-seconds: 60
      # Maximum POST body size (AC20).
      max-request-bytes: 65536

    audit:
      # Audit-log file. Daily rotation; gzip; 7-day retention.
      file: /var/log/ai-sandbox-server/audit.log
      retention-days: 7

    shutdown:
      # UC-74 — bounded internal grace so a lingering WebSocket can't pin the
      # JVM until the systemd backstop. total-grace caps the graceful WS-drain
      # composite; rest-grace caps each individual stream close. With
      # spring.lifecycle.timeout-per-shutdown-phase=15s (baked default), the
      # 15s + 10s = 25s sum stays well under the unit's TimeoutStopSec=70.
      rest-grace-seconds: 5
      total-grace-seconds: 10

    streams:
      idle-timeout-seconds: 7200       # 2 h, AC28
      per-client-cap: 10               # max simultaneous streams per cert
      global-cap: 100                  # max simultaneous streams overall
      max-binary-frame-bytes: 262144   # 256 KiB, AC29
      max-text-frame-bytes: 16384      # 16 KiB,  AC29
      output-ring-bytes: 262144        # 256 KiB per-stream buffer, AC30
      keepalive-ping-seconds: 30
      keepalive-pong-timeout-seconds: 15

    # UC04 — Android client enrollment endpoint. POST /v1/enrollment is the
    # only mTLS-exempt path on the server; trust-surface analysis lives in
    # docs/THREAT_MODEL.md § "Enrollment trust boundary". Tokens issued by
    # `aisandboxctl client invite` land as small JSON files under `dir`
    # (mode 0700, owned by ai-sandbox-server); redemption deletes them
    # atomically, so unredeemed/expired tokens leave no cert behind.
    enrollment:
      dir: /var/lib/ai-sandbox-server/enrollment
      # Token lifetime in minutes (AC32 default).
      default-ttl-minutes: 10
      # Per-IP token bucket. 1 redemption per 60 s by default (AC34).
      rate-limit-per-window: 1
      rate-limit-window-seconds: 60
