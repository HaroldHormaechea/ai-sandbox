# Default application configuration baked into the fat jar.
#
# Production overrides live in /etc/ai-sandbox-server/config.yaml; the
# systemd unit imports it via `--spring.config.additional-location=`.
#
# This file MUST stay in sync with the ServerProperties record schema and
# with server/sample-config.yaml.

spring:
  application:
    name: ai-sandbox-server
  main:
    banner-mode: "off"
  codec:
    max-in-memory-size: 64KB
  webflux:
    base-path: /
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

# Spring Boot's own server.* properties — we run TLS through a custom
# NettyServerCustomizer, so most TLS knobs here are intentionally absent.
#
# Protocol policy (HTTP/1.1 AND HTTP/2 — v0.0.8 re-enables H2 via the
# parent-channel identity walk in ClientIdentityExtractor#channelIdOf)
# is owned by NettyServerCustomizer.
# ALPN advertisements ("h2", "http/1.1") are owned by ReloadableSslContextHolder.rebuild().
# Do NOT add server.http2.enabled here — Spring Boot would add H2C, which
# is incompatible with custom-wired TLS. See the v0.0.6 release commit
# for context.
server:
  port: 12410
  shutdown: graceful
  netty:
    connection-timeout: 5s
    idle-timeout: 60s
  forward-headers-strategy: native

logging:
  level:
    root: INFO
    com.aisandbox.server: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v1/openapi
    enabled: true
  swagger-ui:
    path: /v1/swagger-ui
    enabled: true

ai-sandbox:
  server:
    tls:
      port: 12410
      bind-address: "0.0.0.0"
    pki:
      dir: /etc/ai-sandbox-server/pki
    clients:
      dir: /etc/ai-sandbox-server/clients
    hostscripts:
      # UC05 § AC10,AC12,AC22 — host scripts are bundled inside the
      # release zip and unzipped to /opt/ai-sandbox-server/host/.
      repo-root: /opt/ai-sandbox-server/host
    # UC05 § AC11,AC25 — per-session compose project-directory. spawn.sh
    # and clean.sh receive AI_SANDBOX_HOST_STATE_ROOT pointing here and
    # cd into it before writing the counter / per-session dirs.
    sessions:
      host-state-root: /var/lib/ai-sandbox-server/sessions
    # UC05 § AC14,AC27 — operator-populated secrets dir bind-mounted r/o
    # into each sandbox container at /etc/secrets. Default lives next
    # to PKI material under /etc; mode 0700 enforced by `pki init`.
    secrets:
      dir: /etc/ai-sandbox-server/secrets
    # UC-62 — the always-on "SERVER SSH SESSION": a tmux login shell on the
    # management-server host itself, managed in-process (no Docker, no host
    # script). socket-path / shell / workdir default at runtime when omitted
    # (see ServerProperties.ServerSsh): socket → <sessions.host-state-root>/
    # server-ssh.sock, shell → $SHELL else /bin/bash, workdir → JVM cwd.
    server-ssh:
      enabled: true
      session-name: ai-sandbox-server-ssh
    limits:
      per-ip-new-conn-per-window: 10
      per-ip-window-seconds: 10
      per-ip-concurrent: 10
      spawn-timeout-seconds: 60
      max-request-bytes: 65536
    audit:
      file: /var/log/ai-sandbox-server/audit.log
      retention-days: 7
    shutdown:
      rest-grace-seconds: 30
      total-grace-seconds: 60
    streams:
      idle-timeout-seconds: 7200
      per-client-cap: 10
      global-cap: 100
      max-binary-frame-bytes: 262144
      max-text-frame-bytes: 16384
      output-ring-bytes: 262144
      keepalive-ping-seconds: 30
      keepalive-pong-timeout-seconds: 15
    # UC04 — enrollment endpoint. POST /v1/enrollment is the only
    # mTLS-exempt path on the server; see docs/THREAT_MODEL.md §
    # "Enrollment trust boundary" for the trust-surface analysis.
    enrollment:
      dir: /var/lib/ai-sandbox-server/enrollment
      default-ttl-minutes: 10
      rate-limit-per-window: 1
      rate-limit-window-seconds: 60
