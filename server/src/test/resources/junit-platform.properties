# Per-test-method default timeout (UC-46 CI hardening).
# Any single @Test method that runs longer than this fails fast and names
# itself, instead of hanging the whole `:server:test` job until the CI
# 15-min job timeout kills it with no diagnostic. 300s is intentionally
# generous: real tests (even TLS RANDOM_PORT boot tests) finish in seconds,
# so only a genuine hang exceeds it.
junit.jupiter.execution.timeout.testable.method.default = 300s
