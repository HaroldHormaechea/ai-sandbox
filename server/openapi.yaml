openapi: 3.1.0
info:
  title: ai-sandbox management server
  description: mTLS-gated REST + WebSocket API for the ai-sandbox UC02 multi-session
    kit.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 0.0.1
servers:
- url: https://localhost:12410
  description: Default mTLS endpoint.
paths:
  /v1/sessions:
    get:
      tags:
      - session-controller
      operationId: list
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
    post:
      tags:
      - session-controller
      operationId: spawn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpawnRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /v1/enrollment:
    post:
      tags:
      - enrollment-controller
      summary: Redeem a single-use enrollment token (UC04).
      description: "The only mTLS-exempt path on the server. Returns a freshly-minted\
        \ PKCS#12 bundle (private key + cert) wrapped with the agreed transport\
        \ passphrase 'ai-sandbox-enrollment' (UC14 — not a secret; required because\
        \ the JDK 21 default PKCS#12 emitter and BouncyCastle 1.79 cannot agree on\
        \ an empty char[]). The newly-minted public cert is written to the server\
        \ allowlist before the response is returned, so the client can immediately\
        \ use the new identity on the next request."
      operationId: redeem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentRequest"
        required: true
      responses:
        "201":
          description: Bundle minted.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: "Token invalid, expired, or already redeemed."
          content:
            application/problem+json: {}
        "413":
          description: Request body too large.
          content:
            application/problem+json: {}
        "429":
          description: Per-IP rate limit tripped.
          content:
            application/problem+json: {}
  /v1/clients:
    get:
      tags:
      - client-controller
      operationId: list_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSummary"
    post:
      tags:
      - client-controller
      operationId: add
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClientRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /v1/sessions/{n}:
    get:
      tags:
      - session-controller
      operationId: detail
      parameters:
      - name: "n"
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
    delete:
      tags:
      - session-controller
      operationId: delete
      parameters:
      - name: "n"
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /v1/healthz:
    get:
      tags:
      - health-controller
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /v1/clients/{cnOrFingerprint}:
    delete:
      tags:
      - client-controller
      operationId: delete_1
      parameters:
      - name: cnOrFingerprint
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
components:
  schemas:
    SpawnRequest:
      type: object
      description: Body of POST /v1/sessions.
      properties:
        label:
          type: string
          description: Optional label set as com.ai-sandbox.label on the container.
          pattern: "[A-Za-z0-9._:/+\\- ]{1,64}"
        workspaceMode:
          type: string
          default: shared
          description: shared | isolated
        claudeConfigMode:
          type: string
          default: shared
          description: shared | isolated
    EnrollmentRequest:
      type: object
      description: Body of POST /v1/enrollment (UC04).
      properties:
        token:
          type: string
          description: Opaque single-use token issued by `aisandboxctl client invite
            <name>`.
          example: 8a1f3c0e9b4d…
          maxLength: 256
          minLength: 32
          pattern: "[A-Za-z0-9._-]{32,256}"
      required:
      - token
    AddClientRequest:
      type: object
      description: Body of POST /v1/clients.
      properties:
        name:
          type: string
          minLength: 1
          pattern: "[A-Za-z0-9._-]+"
        certPem:
          type: string
          minLength: 1
      required:
      - certPem
      - name
    ClientSummary:
      type: object
      description: Item in GET /v1/clients.
      properties:
        name:
          type: string
        cn:
          type: string
        fingerprint:
          type: string
        serial:
          type: string
        addedAt:
          type: string
          format: date-time
