openapi: 3.1.0
info:
  title: ai-sandbox management server
  description: mTLS-gated REST + WebSocket API for the ai-sandbox UC02 multi-session
    kit.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 0.0.1
servers:
- url: https://localhost:12410
  description: Default mTLS endpoint.
paths:
  /v1/sessions:
    get:
      tags:
      - session-controller
      summary: List all ai-sandbox sessions.
      operationId: list
      responses:
        "200":
          description: "All enumerated sessions (running, starting, provisioning,\
            \ terminating, stopped)."
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
    post:
      tags:
      - session-controller
      operationId: spawn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpawnRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /v1/sessions/{n}/{action}:
    post:
      tags:
      - session-controller
      summary: Drive a Docker-lifecycle action (stop/start/pause/unpause) on a session.
      description: Runs lifecycle.sh for the target session. 204 on success; 404 session_not_found
        for an unknown N; 409 session_state_conflict when the action is invalid for
        the current state; 500 internal_error when lifecycle.sh exits non-zero.
      operationId: lifecycle
      parameters:
      - name: "n"
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: action
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Action applied (lifecycle.sh exited 0).
          content:
            '*/*':
              schema:
                type: object
        "404":
          description: No session with that N.
          content:
            application/problem+json: {}
        "409":
          description: Action invalid for the session's current state.
          content:
            application/problem+json: {}
        "500":
          description: lifecycle.sh exited non-zero.
          content:
            application/problem+json: {}
  /v1/sessions/{n}/mcp:
    get:
      tags:
      - mcp-controller
      summary: List the MCP servers configured for a session.
      description: "Returns the session's MCP servers and their current state, as\
        \ known to the embedded Claude Code (claude mcp list). Degrades to an empty\
        \ list for a non-running session or an unrecognised MCP surface — never a\
        \ 4xx for those cases."
      operationId: list_1
      parameters:
      - name: "n"
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: The session's MCP servers (possibly empty).
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpServerSummary"
    post:
      tags:
      - mcp-controller
      summary: Register a new MCP server for a session.
      description: Adds an MCP server (stdio command or http/sse URL) to the session's
        embedded Claude Code via an argv-only `claude mcp add`. 201 with the server's
        post-add state; 400 malformed; 409 duplicate name; 500 on add failure.
      operationId: add
      parameters:
      - name: "n"
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpAddRequest"
      responses:
        "201":
          description: The server was registered; carries its post-add state.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/McpActionResult"
        "400":
          description: Malformed or missing required fields.
          content:
            application/problem+json: {}
        "409":
          description: A server with that name is already configured.
          content:
            application/problem+json: {}
        "500":
          description: The underlying claude mcp add call failed.
          content:
            application/problem+json: {}
  /v1/sessions/{n}/mcp/{name}/{action}:
    post:
      tags:
      - mcp-controller
      summary: Drive an MCP control action (login/reconnect/refresh) on one server.
      description: 200 with the server's post-action state. login initiates the auth
        flow in the live session (it cannot complete OAuth headlessly); reconnect/refresh
        re-run the health check. An unknown server name yields state=unknown rather
        than a 404.
      operationId: operate
      parameters:
      - name: "n"
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Action applied; carries the server's post-action state.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/McpActionResult"
        "500":
          description: The underlying claude mcp / pane-injection call failed.
          content:
            application/problem+json: {}
  /v1/sessions/server-ssh:
    post:
      tags:
      - session-controller
      summary: Create (or focus) the singleton server host-shell session.
      description: "Opens a tmux login shell on the management-server host (NOT a\
        \ sandbox container) and returns its pinned row. Idempotent: a second call\
        \ focuses the existing row rather than creating a second one (server-enforced\
        \ singleton)."
      operationId: createServerSsh
      responses:
        "200":
          description: "The server host-shell row (type=server-ssh, reserved id)."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionSummary"
  /v1/server/update/apply:
    post:
      tags:
      - server-update-controller
      summary: Trigger a self-update to the latest server-v* release.
      description: "Emits a parameter-free trigger consumed by the independent root\
        \ ai-sandbox-updater unit, which self-determines the latest server-v* target,\
        \ installs the .deb, and restarts the service. Returns promptly without blocking\
        \ on the restart. The server passes the updater no version, path, or arguments."
      operationId: apply
      responses:
        "200":
          description: The update trigger was emitted (accepted=true).
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UpdateApplyResponse"
  /v1/enrollment:
    post:
      tags:
      - enrollment-controller
      summary: Redeem a single-use enrollment token (UC04).
      description: "The only mTLS-exempt path on the server. Returns a freshly-minted\
        \ PKCS#12 bundle (private key + cert) wrapped with the agreed transport passphrase\
        \ 'ai-sandbox-enrollment' (UC14 — not a secret; required because the JDK 21\
        \ default PKCS#12 emitter and BouncyCastle 1.79 cannot agree on an empty char[]).\
        \ The newly-minted public cert is written to the server allowlist before the\
        \ response is returned, so the client can immediately use the new identity\
        \ on the next request."
      operationId: redeem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentRequest"
        required: true
      responses:
        "201":
          description: Bundle minted.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: "Token invalid, expired, or already redeemed."
          content:
            application/problem+json: {}
        "413":
          description: Request body too large.
          content:
            application/problem+json: {}
        "429":
          description: Per-IP rate limit tripped.
          content:
            application/problem+json: {}
  /v1/clients:
    get:
      tags:
      - client-controller
      operationId: list_2
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSummary"
    post:
      tags:
      - client-controller
      operationId: add_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClientRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /v1/workspace/projects:
    get:
      tags:
      - workspace-controller
      summary: List the selectable workspace projects (top-level folders under the
        shared workspace root).
      operationId: listProjects
      responses:
        "200":
          description: All selectable projects (may be empty when the workspace root
            is absent or has no folders).
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceProjectSummary"
  /v1/sessions/{n}:
    get:
      tags:
      - session-controller
      summary: Get detail for a single session by N.
      operationId: detail
      parameters:
      - name: "n"
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Session detail.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionDetailDto"
        "404":
          description: No session with that N.
          content:
            application/problem+json: {}
    delete:
      tags:
      - session-controller
      summary: Delete (tear down) a session by N.
      description: "Runs clean.sh for the target session. With force=false (default),\
        \ a non-existent N returns 404 session_not_found and clean.sh is NOT run;\
        \ with force=true the existence check is skipped and clean.sh runs unconditionally\
        \ (operator escape hatch). 204 on success; 500 internal_error only when clean.sh\
        \ actually ran and exited non-zero."
      operationId: delete
      parameters:
      - name: "n"
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "204":
          description: Session deleted (clean.sh exited 0).
          content:
            '*/*':
              schema:
                type: object
        "404":
          description: No session with that N (force=false only).
          content:
            application/problem+json: {}
        "500":
          description: clean.sh exited non-zero.
          content:
            application/problem+json: {}
  /v1/server/update/check:
    get:
      tags:
      - server-update-controller
      summary: Check GitHub for a newer server-v* release.
      description: "Unauthenticated (no GitHub credentials) lookup of the newest server-v*\
        \ release, compared with the running version by semantic-version ordering.\
        \ Degrades to updateAvailable=false outside a packaged jar."
      operationId: check
      responses:
        "200":
          description: "Current + latest version, updateAvailable flag, changelog\
            \ + .deb URLs."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UpdateCheckResponse"
  /v1/models:
    get:
      tags:
      - model-controller
      operationId: list_3
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelSummary"
  /v1/healthz:
    get:
      tags:
      - health-controller
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /v1/sessions/{n}/mcp/{name}:
    delete:
      tags:
      - mcp-controller
      summary: Deregister an MCP server from a session.
      description: Removes the named MCP server via an argv-only `claude mcp remove`.
        200 with an honest note (deregister + reconcile on next reload; a running
        child is not force-killed); 404 unknown server; 500 on remove failure.
      operationId: remove
      parameters:
      - name: "n"
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The server was deregistered.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/McpActionResult"
        "404":
          description: No MCP server with that name in the session.
          content:
            application/problem+json: {}
        "500":
          description: The underlying claude mcp remove call failed.
          content:
            application/problem+json: {}
  /v1/clients/{cnOrFingerprint}:
    delete:
      tags:
      - client-controller
      operationId: delete_1
      parameters:
      - name: cnOrFingerprint
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
components:
  schemas:
    SpawnRequest:
      type: object
      description: Body of POST /v1/sessions.
      properties:
        label:
          type: string
          description: Optional label set as com.ai-sandbox.label on the container.
          pattern: "[A-Za-z0-9._:/+\\- ]{1,64}"
        workspaceMode:
          type: string
          default: shared
          description: shared | isolated
        claudeConfigMode:
          type: string
          default: shared
          description: shared | isolated
        workspaceProject:
          type: string
          description: "UC-98 — id of the selected workspace project (a folder name\
            \ from GET /v1/workspace/projects). Omit / null for the \"None\" default,\
            \ which preserves today's spawn behaviour exactly (no setup prompt injected).\
            \ When a real project is chosen, the server auto-injects and submits \"\
            We will work in the project {folder}.\" into the session's Claude once\
            \ it is ready, before the user attaches."
          example: my-project
          pattern: "[A-Za-z0-9._+\\- ]{1,128}"
    McpAddRequest:
      type: object
      description: "Body of POST /v1/sessions/{n}/mcp (UC-82) — register a new MCP\
        \ server."
      properties:
        name:
          type: string
          description: "MCP server identifier. [A-Za-z0-9._-], 1-128 chars, no spaces,\
            \ no leading '-'."
          example: atlassian
          minLength: 1
          pattern: "[A-Za-z0-9._-]{1,128}"
        transport:
          type: string
          description: Transport/type of the MCP server.
          enum:
          - stdio
          - http
          - sse
          example: stdio
        command:
          type: string
          description: stdio transport — the executable to run (required for stdio).
          example: npx
        args:
          type: array
          description: stdio transport — arguments passed to the command.
          items:
            type: string
        url:
          type: string
          description: http / sse transport — the server URL (required for those;
            http(s) only).
          example: https://mcp.atlassian.com/v1/sse
        env:
          type: object
          additionalProperties:
            type: string
          description: stdio transport — environment variables for the command (K=V).
            Values are secret.
        headers:
          type: array
          description: "http / sse transport — \"Header: value\" strings. Values are\
            \ secret."
          items:
            type: string
      required:
      - name
    McpActionResult:
      type: object
      description: UC-67 — outcome of an MCP control action (login/reconnect/refresh).
      properties:
        name:
          type: string
          description: The MCP server the action targeted.
          example: atlassian
        state:
          type: string
          description: The server's state after the action (from a fresh inventory).
          enum:
          - connected
          - needs_auth
          - failed
          - pending
          - unknown
          example: needs_auth
        message:
          type: string
          description: "Short, honest note about what happened. login only INITIATES\
            \ the flow in the live session — it never completes OAuth headlessly."
          example: "Opens MCP authentication in the live session — complete it there,\
            \ then refresh."
    SessionSummary:
      type: object
      description: A summary row returned by GET /v1/sessions.
      properties:
        "n":
          type: integer
          format: int32
        label:
          type: string
          description: Free-form label echoed from com.ai-sandbox.label
        tmuxTitle:
          type: string
          description: "Tmux window title, or '(idle)' / '(unavailable)'"
        state:
          type: string
          description: "running | starting | provisioning | terminating | paused |\
            \ stopped. provisioning (UC-27) = the container is up but still installing\
            \ its spawn-time toolchains, shown as 'Installing prerequisites' client-side.\
            \ terminating (UC-28) = the session's teardown (clean.sh / docker compose\
            \ down) is in progress; shown with a destructive-red 'awaiting termination'\
            \ pill client-side and blocks further delete attempts. paused (UC-46)\
            \ = the container is frozen via the cgroup freezer (docker compose pause);\
            \ resumable with the Unpause lifecycle action."
          enum:
          - running
          - starting
          - provisioning
          - terminating
          - paused
          - stopped
        uptimeSec:
          type: integer
          format: int64
        activeStreams:
          type: integer
          format: int32
        startedAt:
          type: string
          format: date-time
        conversationName:
          type: string
          description: "UC-47 — the Claude conversation name for the session's main\
            \ pane, when one is known (active conversation on a running session).\
            \ The client shows it as the row's primary status line, falling back to\
            \ tmuxTitle when absent. Omitted from the JSON when null (class-level\
            \ @JsonInclude(NON_NULL)): an idle / between-conversations / non-running\
            \ session simply has no field."
        working:
          type: boolean
          default: false
          description: "UC-48 — true when Claude is actively working in this session's\
            \ main pane (a turn is mid-flight); false when idle, awaiting an answer,\
            \ or non-running. The client shows an animated working spinner in the\
            \ row's status area while true (double-gated on state==running). Hysteresis-debounced\
            \ server-side so a brief between-turns idle does not strobe it."
        pendingQuestion:
          type: boolean
          default: false
          description: "UC-49 — true when the session's main pane is showing an AskUserQuestion\
            \ awaiting an answer (single or multi-question); false when idle, working,\
            \ or non-running. Mutually exclusive with working (a pending question\
            \ is 'waiting', never 'working'). The client shows a '?' badge in the\
            \ row's status area while true (double-gated on state==running) and suppresses\
            \ the working spinner. Derived from the visible pane, not the transcript."
        type:
          type: string
          default: claude
          description: "UC-62 — session kind. 'claude' for an ordinary sandbox/Docker\
            \ session; 'server-ssh' for the single always-on server host-shell row\
            \ (a tmux login shell on the management-server host, reserved id 0). The\
            \ client pins the server-ssh row to the top of the list, badges it 'SERVER\
            \ SSH SESSION', offers only Remove, and routes its taps to the terminal\
            \ (never the Claude conversation view)."
          enum:
          - claude
          - server-ssh
        pendingQuestionText:
          type: string
          description: "UC-69 — the first pending question's text, when the session's\
            \ main pane is showing an AskUserQuestion awaiting an answer (the first\
            \ question when several are raised together). The client uses it as the\
            \ body of the local push notification it posts on the pending transition,\
            \ deep-linking into the conversation. Omitted from the JSON when null\
            \ (class-level @JsonInclude(NON_NULL)): an idle / working / non-running\
            \ session, or one whose body was not parseable, simply has no field. Derived\
            \ from the visible pane, not the transcript."
    UpdateApplyResponse:
      type: object
      description: Response of POST /v1/server/update/apply (UC-84).
      properties:
        accepted:
          type: boolean
          description: Always true on success (failures return a problem+json instead).
        targetVersion:
          type: string
          description: "Best-effort latest server-v* version the update targets, or\
            \ omitted if unresolved."
    EnrollmentRequest:
      type: object
      description: Body of POST /v1/enrollment (UC04).
      properties:
        token:
          type: string
          description: Opaque single-use token issued by `aisandboxctl client invite
            <name>`.
          example: 8a1f3c0e9b4d…
          maxLength: 256
          minLength: 32
          pattern: "[A-Za-z0-9._-]{32,256}"
      required:
      - token
    AddClientRequest:
      type: object
      description: Body of POST /v1/clients.
      properties:
        name:
          type: string
          minLength: 1
          pattern: "[A-Za-z0-9._-]+"
        certPem:
          type: string
          minLength: 1
      required:
      - certPem
      - name
    WorkspaceProjectSummary:
      type: object
      description: UC-98 — a selectable workspace project returned by GET /v1/workspace/projects.
      properties:
        id:
          type: string
          description: Stable id of the project — sent back as SpawnRequest.workspaceProject.
          example: my-project
        displayName:
          type: string
          description: Human-readable name shown in the drop-down (the folder name).
          example: my-project
    SessionDetailDto:
      type: object
      description: "Detail returned by GET /v1/sessions/{n}."
      properties:
        summary:
          $ref: "#/components/schemas/SessionSummary"
        workspaceHostPath:
          type: string
        claudeConfigHostPath:
          type: string
        connectedClients:
          type: array
          items:
            type: string
    McpServerSummary:
      type: object
      description: "UC-67 — one of a session's MCP servers, returned by GET /v1/sessions/{n}/mcp."
      properties:
        name:
          type: string
          description: MCP server identifier (its key in the session's MCP config).
          example: atlassian
        transport:
          type: string
          description: Best-effort transport hint.
          enum:
          - stdio
          - http
          - sse
          - unknown
          example: sse
        state:
          type: string
          description: Coarse connection state derived defensively from `claude mcp
            list`. connected = healthy; needs_auth = an interactive login the client
            must initiate; failed = configured but the health check failed; pending
            = a check is in flight; unknown = the status text was unrecognised.
          enum:
          - connected
          - needs_auth
          - failed
          - pending
          - unknown
          example: needs_auth
        detail:
          type: string
          description: Raw connection detail from the list line (command or URL);
            display-only.
          example: https://mcp.atlassian.com/v1/sse
    UpdateCheckResponse:
      type: object
      description: Response of GET /v1/server/update/check (UC-84).
      properties:
        currentVersion:
          type: string
          description: "The server's running version (jar manifest), or 'dev' outside\
            \ a packaged jar."
        latestVersion:
          type: string
          description: "Newest server-v* release version, or omitted when none is\
            \ found."
        updateAvailable:
          type: boolean
          description: True iff latestVersion is strictly newer than currentVersion.
        releaseHtmlUrl:
          type: string
          description: The latest release's GitHub HTML page — the external-browser
            Changelog link.
        debAssetUrl:
          type: string
          description: Download URL of the matching *_amd64.deb asset. Informational
            only.
    ModelSummary:
      type: object
      description: UC-66 — an advertised Claude model returned by GET /v1/models.
      properties:
        id:
          type: string
          description: Model id/alias sent to Claude Code via `/model <id>`.
          example: opus
        label:
          type: string
          description: Human-readable label for the model picker.
          example: Opus 4.8
    ClientSummary:
      type: object
      description: Item in GET /v1/clients.
      properties:
        name:
          type: string
        cn:
          type: string
        fingerprint:
          type: string
        serial:
          type: string
        addedAt:
          type: string
          format: date-time
