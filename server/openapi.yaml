# Committed OAS — regenerated by `./gradlew :server:generateOpenApiDocs`.
# CI fails on drift; do NOT hand-edit. This file is the initial skeleton
# committed before the first server boot; the very first CI run will
# overwrite it via the Gradle task and the diff-check job will green up.
openapi: 3.1.0
info:
  title: ai-sandbox management server
  version: 0.0.1
  description: |
    mTLS-gated REST + WebSocket API for the ai-sandbox UC02 multi-session kit.
    Every endpoint requires a valid client certificate from the server's
    allowlist; there are no anonymous paths.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://localhost:12410
    description: Default mTLS endpoint.

paths:
  /v1/healthz:
    get:
      summary: Liveness + readiness probe.
      responses:
        "200":
          description: Healthy.
        "503":
          description: Unhealthy (RFC 9457 body).
  /v1/sessions:
    get:
      summary: List running ai-sandbox sessions.
      responses:
        "200":
          description: OK.
    post:
      summary: Spawn a new session (sync, 60 s timeout).
      responses:
        "201":
          description: Created.
        "504":
          description: Spawn timed out.
  /v1/sessions/{n}:
    get:
      summary: Session detail.
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK.
        "404":
          description: Not found.
    delete:
      summary: Clean a session.
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Cleaned.
        "404":
          description: Not found.
  /v1/clients:
    get:
      summary: List currently-allowed client certs.
      responses:
        "200":
          description: OK.
    post:
      summary: Add a client cert to the allowlist.
      responses:
        "201":
          description: Created.
        "400":
          description: Bad cert PEM.
        "409":
          description: Name conflict.
  /v1/clients/{cnOrFingerprint}:
    delete:
      summary: Remove a client cert from the allowlist.
      parameters:
        - name: cnOrFingerprint
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed.
        "404":
          description: Not found.
