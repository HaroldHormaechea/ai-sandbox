name: android-gate

# UC-85 (AC-8, Step 2) — the FULL deterministic functional gate, emulator-in-CI.
#
# Runs the exact flow of android/gate.sh on a standard GitHub-hosted ubuntu
# runner (where /dev/kvm is present — proven by android-gate-smoke): the REAL
# mTLS server under the `replay` Spring profile (committed protocol fixtures +
# synthetic sessions + answer-echo) + the on-device instrumented Compose gate
# suite driven by stable testTag — no live Claude, no LLM, no screenshot
# eyeballing. The `release` skill's Phase 1 gates on a green run of this workflow.
#
# The emulator's AVD lifecycle is owned by reactivecircus/android-emulator-runner;
# gate.sh runs with GATE_SKIP_EMULATOR=1 (reuse the action's emulator, don't boot
# its own) and GATE_KEEP=1 (the ephemeral runner is the teardown).

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'feat/uc-85-deterministic-llm-free-functional-gate'
  pull_request:
    paths:
      - 'android/**'
      - 'server/**'
      - 'fixtures/replay/**'
      - '.github/workflows/android-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 emulator system-images;android-34;google_apis;x86_64'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pre-build server jars + APKs (warm the cache before booting the emulator)
        run: |
          ./gradlew \
            :server:bootJar :server:aisandboxctlJar \
            :android:assembleDebug :android:assembleDebugAndroidTest \
            --no-daemon

      - name: Run the deterministic gate (gate.sh) against the in-CI emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # AC-10 emulator-reliability flags (same as the smoke job + gate.sh).
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -noaudio -no-metrics -camera-back none -camera-front none
          disable-animations: true
          # SINGLE-LINE script (the action runs each line as a separate `sh -c`):
          # gate.sh reuses this emulator (GATE_SKIP_EMULATOR=1) and leaves teardown to
          # the ephemeral runner (GATE_KEEP=1). Its exit code is the gate result.
          script: GATE_SKIP_EMULATOR=1 GATE_KEEP=1 ./android/gate.sh

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gate-logs
          path: .gate-run/log/
          if-no-files-found: warn
