name: server-ci

on:
  pull_request:
    paths:
      - 'server/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/server-ci.yml'
      # UC05 § AC29 — release-install-smoke exercises the bundled host
      # scripts and Docker context. PRs touching only those files must
      # still run the smoke job, so they need to fire server-ci.
      - 'spawn.sh'
      - 'clean.sh'
      - 'attach.sh'
      - 'lib.sh'
      - 'setup.sh'
      - 'spawn.ps1'
      - 'clean.ps1'
      - 'attach.ps1'
      - 'lib.ps1'
      - 'setup.ps1'
      - 'docker-compose.yml'
      - 'SandboxDockerfile'
      - 'entrypoint.sh'
      - '.gitattributes'
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'spawn.sh'
      - 'clean.sh'
      - 'attach.sh'
      - 'lib.sh'
      - 'setup.sh'
      - 'spawn.ps1'
      - 'clean.ps1'
      - 'attach.ps1'
      - 'lib.ps1'
      - 'setup.ps1'
      - 'docker-compose.yml'
      - 'SandboxDockerfile'
      - 'entrypoint.sh'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless + tests + OAS generation
        run: ./gradlew :server:spotlessCheck :server:test :server:generateOpenApiDocs --no-daemon
      - name: Fail on drifted committed OAS
        run: git diff --exit-code -- server/openapi.yaml

  integration:
    runs-on: ubuntu-latest
    needs: build
    env:
      AI_SANDBOX_DIND: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testcontainers integration suite
        run: ./gradlew :server:integrationTest --no-daemon

  # UC05 § AC29,AC30 — smoke-test the self-contained release zip. Runs
  # parallel to `build` and is required-passing per AC30 (the actual
  # branch-protection gate is operator-side, documented in the release
  # README's CI section).
  #
  # Two phases:
  #   1. Inside ubuntu:24.04 (fresh-VM semantics) install only JDK + unzip,
  #      run `aisandboxctl pki init`, assert the AC10/AC14/AC16/AC17/AC18
  #      contracts. Docker is NOT installed inside the container — the
  #      AC explicitly says "Docker itself is not required for the install
  #      assertions" (see step c).
  #   2. On the host runner (which has docker pre-installed) run
  #      `docker compose build --no-cache` against the bundled
  #      docker-compose.yml + SandboxDockerfile. Catches build-context
  #      drift (the AC29 pitfall: SandboxDockerfile referencing a sibling
  #      outside host/ would fail here).
  release-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build release bundle + .deb package
        run: ./gradlew :server:bootJar :server:aisandboxctlJar :server:generateOpenApiDocs :server:releaseBundle :server:debPackage --no-daemon

      - name: Locate the assembled zip
        id: zip
        run: |
          path="$(ls server/build/release/ai-sandbox-server-*.zip | head -1)"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Locate the assembled .deb
        id: deb
        run: |
          path="$(ls server/build/distributions/ai-sandbox-server_*_amd64.deb | head -1)"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Smoke-test install flow inside ubuntu:24.04
        env:
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          set -euxo pipefail
          install -d "$RUNNER_TEMP/release"
          cp "$ZIP_PATH" "$RUNNER_TEMP/release/release.zip"

          docker run --rm \
              -v "$RUNNER_TEMP/release:/tmp/release:ro" \
              ubuntu:24.04 \
              bash -euxc '
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update -qq
                  apt-get install -y --no-install-recommends \
                      openjdk-21-jdk-headless unzip

                  install -d /opt/ai-sandbox-server
                  unzip -q /tmp/release/release.zip -d /opt/ai-sandbox-server

                  # AC10 — install dir tree shape.
                  test -d /opt/ai-sandbox-server/lib
                  test -d /opt/ai-sandbox-server/host
                  test -d /opt/ai-sandbox-server/systemd
                  test -f /opt/ai-sandbox-server/README.md
                  test -f /opt/ai-sandbox-server/openapi.yaml
                  test -f /opt/ai-sandbox-server/sample-config.yaml
                  test -f /opt/ai-sandbox-server/STREAM_PROTOCOL.md
                  test -f /opt/ai-sandbox-server/systemd/ai-sandbox-server.service

                  # AC20 — unversioned jar filenames at the install path.
                  test -f /opt/ai-sandbox-server/lib/aisandbox-server.jar
                  test -f /opt/ai-sandbox-server/lib/aisandboxctl.jar

                  # AC3,AC4,AC5 — bundled host/ contents + .sh executable.
                  for f in spawn.sh clean.sh attach.sh lib.sh setup.sh entrypoint.sh; do
                      test -x "/opt/ai-sandbox-server/host/$f"
                  done
                  for f in spawn.ps1 clean.ps1 attach.ps1 lib.ps1 setup.ps1 docker-compose.yml SandboxDockerfile; do
                      test -f "/opt/ai-sandbox-server/host/$f"
                  done
                  # AC5,AC6 — SandboxDockerfile COPYs git-hooks/ into the image,
                  # so the bundle must ship it under host/git-hooks/. Catching
                  # this in the install-flow phase (loud "file missing" error)
                  # instead of waiting for the later `compose build` to fail with
                  # a BuildKit cache-key error.
                  test -d /opt/ai-sandbox-server/host/git-hooks
                  test -x /opt/ai-sandbox-server/host/git-hooks/pre-commit

                  # Ensure docker group exists; SystemUserAdmin runs useradd --groups docker per UC05 AC13. The README prereq docker.io would normally provide it, but AC29.b skips Docker in this smoke env.
                  groupadd -f docker

                  # AC13-AC18 — first pki init: succeeds, makes the tree.
                  java -jar /opt/ai-sandbox-server/lib/aisandboxctl.jar pki init

                  # AC14 — directory tree + modes. stat %a returns the
                  # octal mode (3-digit when leading 0 elided).
                  assert_mode() {
                      local p="$1" want="$2" got
                      got="$(stat -c %a "$p")"
                      if [ "$got" != "$want" ]; then
                          echo "FAIL: $p mode is $got, expected $want" >&2
                          return 1
                      fi
                  }
                  assert_mode /etc/ai-sandbox-server                  750
                  assert_mode /etc/ai-sandbox-server/pki              700
                  assert_mode /etc/ai-sandbox-server/clients          700
                  assert_mode /etc/ai-sandbox-server/secrets          700
                  # UC07 Bug C — enrollment dir moved to /var/lib
                  # (runtime state belongs under /var per FHS, not /etc).
                  assert_mode /var/lib/ai-sandbox-server/enrollment   700
                  assert_mode /var/lib/ai-sandbox-server/sessions     750
                  assert_mode /var/log/ai-sandbox-server              750
                  assert_mode /etc/ai-sandbox-server/pki/server.key   600

                  # AC15 — cert + key exist.
                  test -f /etc/ai-sandbox-server/pki/server.crt
                  test -f /etc/ai-sandbox-server/pki/server.key

                  # AC13 — system user exists.
                  id ai-sandbox-server >/dev/null

                  # AC16 — config.yaml has the four baked-in defaults.
                  grep -q "repo-root: /opt/ai-sandbox-server/host" /etc/ai-sandbox-server/config.yaml
                  grep -q "host-state-root: /var/lib/ai-sandbox-server/sessions" /etc/ai-sandbox-server/config.yaml
                  grep -q "dir: /etc/ai-sandbox-server/secrets" /etc/ai-sandbox-server/config.yaml
                  grep -q "dir: /var/lib/ai-sandbox-server/enrollment" /etc/ai-sandbox-server/config.yaml

                  # AC17 — re-run without --force: exit 2 + conflict lines.
                  set +e
                  java -jar /opt/ai-sandbox-server/lib/aisandboxctl.jar pki init >/tmp/rerun.out 2>/tmp/rerun.err
                  rc=$?
                  set -e
                  if [ "$rc" -ne 2 ]; then
                      echo "FAIL: rerun without --force exited $rc, expected 2" >&2
                      cat /tmp/rerun.err >&2
                      exit 1
                  fi
                  grep -q "^conflict: " /tmp/rerun.err

                  # AC18 — --force succeeds.
                  java -jar /opt/ai-sandbox-server/lib/aisandboxctl.jar pki init --force

                  # ── UC06 § AC20 — secrets seed non-interactive smoke ──
                  # `ssh-keygen` is part of openssh-client (not in the
                  # minimal base layer). secrets seed shells out to it
                  # for the encryption probe + (optionally) the
                  # ed25519 generator; install only the client subset
                  # to keep this phase fast.
                  apt-get install -y --no-install-recommends openssh-client

                  # Generate a fresh key on-the-fly so the smoke is
                  # self-contained — no test fixture under server/test-resources/.
                  ssh-keygen -t ed25519 -f /tmp/seed-test-key -N "" -q -C smoke

                  # AC20 — flag-driven, no-TTY, both optional steps opted-out.
                  java -jar /opt/ai-sandbox-server/lib/aisandboxctl.jar secrets seed \
                      --no-gh --no-claude-preinit \
                      --git-key /tmp/seed-test-key \
                      --git-name "Smoke Test" \
                      --git-email "smoke@example.com"

                  # AC2/AC4 — outputs at the expected paths.
                  test -f /etc/ai-sandbox-server/secrets/git-key
                  test -f /etc/ai-sandbox-server/secrets/gitconfig
                  # AC5/AC6 — opt-out: gh-token absent, claude template
                  # dir present-but-empty so the compose RO mount has a
                  # valid attach target.
                  test ! -e /etc/ai-sandbox-server/secrets/gh-token
                  test -d /etc/ai-sandbox-server/templates/claude-config
                  # AC4 — gitconfig has the expected content shape.
                  grep -q "name = Smoke Test" /etc/ai-sandbox-server/secrets/gitconfig
                  grep -q "email = smoke@example.com" /etc/ai-sandbox-server/secrets/gitconfig

                  # AC2/AC4 — modes.
                  assert_mode /etc/ai-sandbox-server/secrets/git-key   600
                  assert_mode /etc/ai-sandbox-server/secrets/gitconfig 600
                  assert_mode /etc/ai-sandbox-server/templates/claude-config 750

                  # AC2/AC4 — ownership.
                  assert_owner() {
                      local p="$1" want_user="$2" want_group="$3" got
                      got="$(stat -c "%U:%G" "$p")"
                      if [ "$got" != "$want_user:$want_group" ]; then
                          echo "FAIL: $p owner is $got, expected $want_user:$want_group" >&2
                          return 1
                      fi
                  }
                  assert_owner /etc/ai-sandbox-server/secrets/git-key       ai-sandbox-server ai-sandbox-server
                  assert_owner /etc/ai-sandbox-server/secrets/gitconfig     ai-sandbox-server ai-sandbox-server
                  assert_owner /etc/ai-sandbox-server/templates/claude-config ai-sandbox-server ai-sandbox-server

                  # AC13 — re-run without --force refuses with conflict lines.
                  set +e
                  java -jar /opt/ai-sandbox-server/lib/aisandboxctl.jar secrets seed \
                      --no-gh --no-claude-preinit \
                      --git-key /tmp/seed-test-key \
                      --git-name "Smoke Test" \
                      --git-email "smoke@example.com" \
                      >/tmp/seed-rerun.out 2>/tmp/seed-rerun.err
                  rc=$?
                  set -e
                  if [ "$rc" -ne 2 ]; then
                      echo "FAIL: secrets seed rerun without --force exited $rc, expected 2" >&2
                      cat /tmp/seed-rerun.err >&2
                      exit 1
                  fi
                  grep -q "^conflict: " /tmp/seed-rerun.err

                  # AC13 — --force succeeds + lists the overwrite paths.
                  java -jar /opt/ai-sandbox-server/lib/aisandboxctl.jar secrets seed --force \
                      --no-gh --no-claude-preinit \
                      --git-key /tmp/seed-test-key \
                      --git-name "Smoke Test" \
                      --git-email "smoke@example.com" \
                      2>/tmp/seed-force.err
                  grep -q "overwrite: /etc/ai-sandbox-server/secrets/git-key" /tmp/seed-force.err
                  grep -q "overwrite: /etc/ai-sandbox-server/secrets/gitconfig" /tmp/seed-force.err

                  echo "install-flow assertions passed."

                  # ── UC03 § AC19 — boot smoke ──
                  # The checks above verify the install LAYOUT. They do
                  # NOT actually start the service, which means
                  # bootstrap-ordering regressions (e.g. SSL context
                  # loaded too late, missing @PostConstruct on a
                  # SmartLifecycle bean) ship in green CI runs.
                  # This block boots the bundled jar end-to-end and
                  # round-trips /v1/healthz over mTLS — catching the
                  # class of bug that the systemd exit-1-restart spiral
                  # masks on a production host.
                  apt-get install -y --no-install-recommends curl

                  # Mint a client cert BEFORE starting the server so the
                  # in-process allowlist scan picks it up at boot — we
                  # do not want to race the AllowlistWatcher debounced
                  # WatchService update from the test side.
                  java -jar /opt/ai-sandbox-server/lib/aisandboxctl.jar client mint smoke \
                      --pem --out /tmp/smoke-client

                  # Replicate the systemd unit ExecStart (User=,
                  # Group=, java argv) without systemd. Hardening
                  # directives (ProtectSystem=strict, etc.) are not
                  # exercised here — the boot path under test is the
                  # Spring bootstrap, not the sandboxing layer.
                  runuser -u ai-sandbox-server -- bash -c '"'"'
                      exec /usr/bin/java \
                          -Xms256m -Xmx1g \
                          -Dfile.encoding=UTF-8 \
                          -jar /opt/ai-sandbox-server/lib/aisandbox-server.jar \
                          --spring.config.additional-location=optional:file:/etc/ai-sandbox-server/config.yaml \
                          >/tmp/server.out 2>/tmp/server.err
                  '"'"' &
                  SERVER_PID=$!

                  # Up to 60s for the TLS listener to bind. Bail early
                  # if the JVM exits before then — that is the bug
                  # class we are catching.
                  ready=0
                  for i in $(seq 1 60); do
                      if (exec 3<>/dev/tcp/127.0.0.1/12410) 2>/dev/null; then
                          exec 3<&- 3>&- || true
                          ready=1
                          echo "Boot smoke: port 12410 open after ${i}s."
                          break
                      fi
                      if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                          echo "FAIL: server JVM exited before port 12410 came up." >&2
                          echo "── server stdout (tail) ──" >&2
                          tail -120 /tmp/server.out >&2
                          echo "── server stderr (tail) ──" >&2
                          tail -80 /tmp/server.err >&2
                          exit 1
                      fi
                      sleep 1
                  done
                  if [ "$ready" -ne 1 ]; then
                      echo "FAIL: port 12410 never accepted a connection in 60s." >&2
                      echo "── server stdout (tail) ──" >&2
                      tail -120 /tmp/server.out >&2
                      echo "── server stderr (tail) ──" >&2
                      tail -80 /tmp/server.err >&2
                      kill -TERM "$SERVER_PID" 2>/dev/null || true
                      exit 1
                  fi

                  # Round-trip /v1/healthz over mTLS. The smoke env
                  # deliberately has no Docker installed, so HealthService
                  # reports dockerOk=false and the endpoint returns 503
                  # with a Problem-Details body. Both 200 and 503 are
                  # valid signals that TLS + mTLS + Spring + the routing
                  # layer all came up — anything else is a regression.
                  #
                  # UC07 Bug A — the v0.0.7 server cert now carries a SAN
                  # extension (DNS:<auto-hostname>, DNS:localhost, IP:127.0.0.1).
                  # `IP:127.0.0.1` is the one that matters here: curl can
                  # connect directly to https://127.0.0.1:12410 without the
                  # pre-v0.0.7 `--resolve ai-sandbox-server:...` shim, which
                  # was a workaround for the CN-only cert and is now both
                  # unnecessary AND broken (the auto-hostname inside the
                  # smoke container is the random docker hash, not
                  # "ai-sandbox-server"). Same form as the .deb phase below.
                  http_code="$(curl -sS -o /tmp/health.body -w "%{http_code}" \
                      --cacert /etc/ai-sandbox-server/pki/server.crt \
                      --cert /tmp/smoke-client/smoke.crt \
                      --key /tmp/smoke-client/smoke.key \
                      https://127.0.0.1:12410/v1/healthz || echo 000)"
                  if [ "$http_code" != "200" ] && [ "$http_code" != "503" ]; then
                      echo "FAIL: /v1/healthz returned $http_code (expected 200 or 503)." >&2
                      echo "── response body ──" >&2
                      cat /tmp/health.body >&2 || true
                      echo "── server stdout (tail) ──" >&2
                      tail -120 /tmp/server.out >&2
                      echo "── server stderr (tail) ──" >&2
                      tail -80 /tmp/server.err >&2
                      kill -TERM "$SERVER_PID" 2>/dev/null || true
                      exit 1
                  fi
                  echo "Boot smoke: /v1/healthz returned $http_code (TLS + mTLS + Spring OK)."

                  # Clean shutdown — sanity-check that SIGTERM is
                  # honoured (the systemd unit relies on it; KillSignal=
                  # SIGTERM with TimeoutStopSec=70).
                  kill -TERM "$SERVER_PID"
                  for i in $(seq 1 30); do
                      if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                          break
                      fi
                      sleep 1
                  done
                  if kill -0 "$SERVER_PID" 2>/dev/null; then
                      echo "FAIL: server did not exit within 30s of SIGTERM." >&2
                      kill -KILL "$SERVER_PID" 2>/dev/null || true
                      exit 1
                  fi
                  wait "$SERVER_PID" 2>/dev/null || true
                  echo "boot smoke assertions passed."
              '

      # UC07 § Feature E — .deb install-flow smoke, parity with the zip
      # smoke above but exercising the dpkg install path end-to-end
      # (postinst hook, /lib/systemd/system/ location, system user
      # creation, SAN-bearing pki init, mTLS round-trip via enrollment).
      - name: Smoke-test .deb install flow inside ubuntu:24.04
        env:
          DEB_PATH: ${{ steps.deb.outputs.path }}
        run: |
          set -euxo pipefail
          install -d "$RUNNER_TEMP/deb"
          cp "$DEB_PATH" "$RUNNER_TEMP/deb/release.deb"

          docker run --rm \
              -v "$RUNNER_TEMP/deb:/tmp/release:ro" \
              ubuntu:24.04 \
              bash -euxc '
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update -qq
                  apt-get install -y --no-install-recommends \
                      openjdk-21-jdk-headless unzip openssh-client curl ca-certificates python3

                  # `docker.io` is one of the .deb Depends but the smoke env
                  # cannot run a Docker daemon; pre-create the `docker` group
                  # the postinst expects, install the .deb, then satisfy
                  # remaining deps with `apt-get -f install -y`.
                  groupadd -f docker
                  dpkg -i /tmp/release/release.deb || true
                  apt-get install -y --no-install-recommends -f
                  dpkg --configure -a

                  # AC layout — jars under /opt/ai-sandbox-server/lib/.
                  test -f /opt/ai-sandbox-server/lib/aisandbox-server.jar
                  test -f /opt/ai-sandbox-server/lib/aisandboxctl.jar
                  # systemd unit at the Debian-canonical path.
                  test -f /lib/systemd/system/ai-sandbox-server.service

                  # postinst — operator dirs at 0750 owned by ai-sandbox-server.
                  assert_owner_mode() {
                      local p="$1" want_user="$2" want_group="$3" want_mode="$4" got
                      got="$(stat -c "%U:%G:%a" "$p")"
                      if [ "$got" != "${want_user}:${want_group}:${want_mode}" ]; then
                          echo "FAIL: $p is $got, expected ${want_user}:${want_group}:${want_mode}" >&2
                          return 1
                      fi
                  }
                  assert_owner_mode /etc/ai-sandbox-server     ai-sandbox-server ai-sandbox-server 750
                  assert_owner_mode /var/lib/ai-sandbox-server ai-sandbox-server ai-sandbox-server 750
                  assert_owner_mode /var/log/ai-sandbox-server ai-sandbox-server ai-sandbox-server 750

                  # System user exists with the documented shell + groups.
                  id ai-sandbox-server >/dev/null
                  getent passwd ai-sandbox-server | grep -q "/usr/sbin/nologin"
                  id -nG ai-sandbox-server | tr " " "\n" | grep -qx docker

                  # `pki init` with --san — the cert MUST carry SAN.
                  java -jar /opt/ai-sandbox-server/lib/aisandboxctl.jar pki init \
                      --san DNS:localhost,IP:127.0.0.1

                  # Cert SAN must contain DNS:localhost, IP:127.0.0.1, AND the
                  # auto-derived hostname (per UC07 Bug A composition rules).
                  AUTO_HOST="$(hostname)"
                  openssl x509 -in /etc/ai-sandbox-server/pki/server.crt -noout -text \
                      | grep -A5 "Subject Alternative Name" >/tmp/san-block.txt
                  grep -q "DNS:localhost"        /tmp/san-block.txt
                  grep -q "IP Address:127.0.0.1" /tmp/san-block.txt
                  if ! grep -qiE "DNS:[^,]*${AUTO_HOST}" /tmp/san-block.txt; then
                      echo "FAIL: SAN missing auto-derived hostname (${AUTO_HOST})" >&2
                      cat /tmp/san-block.txt >&2
                      exit 1
                  fi

                  # Mint a bootstrap client cert (server refuses to start on
                  # an empty allowlist).
                  java -jar /opt/ai-sandbox-server/lib/aisandboxctl.jar client mint bootstrap \
                      --pem --out /tmp/bootstrap

                  # Start the service as ai-sandbox-server (replicates the
                  # systemd unit ExecStart without invoking systemd).
                  runuser -u ai-sandbox-server -- bash -c "exec /usr/bin/java \
                      -Xms256m -Xmx1g \
                      -Dfile.encoding=UTF-8 \
                      -jar /opt/ai-sandbox-server/lib/aisandbox-server.jar \
                      --spring.config.additional-location=optional:file:/etc/ai-sandbox-server/config.yaml \
                      >/tmp/server.out 2>/tmp/server.err" &
                  SERVER_PID=$!

                  # Wait up to 60s for port 12410.
                  ready=0
                  for i in $(seq 1 60); do
                      if (exec 3<>/dev/tcp/127.0.0.1/12410) 2>/dev/null; then
                          exec 3<&- 3>&- || true
                          ready=1
                          break
                      fi
                      if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                          echo "FAIL: server JVM exited before port came up." >&2
                          tail -120 /tmp/server.out >&2 || true
                          tail -80  /tmp/server.err >&2 || true
                          exit 1
                      fi
                      sleep 1
                  done
                  [ "$ready" -eq 1 ] || { echo "FAIL: port 12410 never opened in 60s" >&2; exit 1; }

                  # Issue an enrollment invite non-TTY without --out. The CLI
                  # emits, on stdout: line 1 = single-line {u,t,exp,pin} JSON
                  # (compact, ObjectMapper.writeValueAsString — no pretty
                  # print), then a blank line, then a 4-line operator-facing
                  # summary ("Invite issued: …", token-prefix, expires-at,
                  # file). Empirically verified by reading ClientInviteCommand
                  # call() lines 213-223 against the source tree. `head -n 1`
                  # peels off the JSON; if a future change pretty-prints the
                  # JSON across multiple lines this filter will break — that
                  # is a v0.0.8 cleanup tracked separately (add a --json flag
                  # that suppresses the trailing summary entirely).
                  java -jar /opt/ai-sandbox-server/lib/aisandboxctl.jar client invite alice-phone \
                      --server-url https://127.0.0.1:12410 </dev/null \
                      | head -n 1 >/tmp/invite.json
                  TOKEN="$(python3 -c "import json,sys;print(json.load(sys.stdin)[\"t\"])" </tmp/invite.json)"
                  test -n "$TOKEN"

                  # Round-trip /v1/enrollment with the token. SAN now contains
                  # IP:127.0.0.1 so curl does not need --resolve.
                  body="$(python3 -c "import json,sys;json.dump({\"token\":sys.argv[1]},sys.stdout)" "$TOKEN")"
                  http_code="$(curl -sS -o /tmp/bundle.p12 -w "%{http_code}" \
                      --cacert /etc/ai-sandbox-server/pki/server.crt \
                      -H "Content-Type: application/json" \
                      --data-binary "$body" \
                      https://127.0.0.1:12410/v1/enrollment || echo 000)"
                  if [ "$http_code" != "201" ]; then
                      echo "FAIL: /v1/enrollment returned $http_code (expected 201)" >&2
                      head -c 4096 /tmp/bundle.p12 | od -c | head -20 >&2 || true
                      tail -80 /tmp/server.out >&2 || true
                      tail -40 /tmp/server.err >&2 || true
                      kill -TERM "$SERVER_PID" 2>/dev/null || true
                      exit 1
                  fi
                  # The returned .p12 should parse with an empty passphrase.
                  openssl pkcs12 -in /tmp/bundle.p12 -nokeys -passin pass: -info -noout 2>&1 \
                      | tee /tmp/p12-info.txt
                  grep -q "BEGIN" /tmp/p12-info.txt || {
                      # Some openssl builds emit the cert via stdout rather
                      # than -info; retry without -noout to confirm parseability.
                      openssl pkcs12 -in /tmp/bundle.p12 -nokeys -passin pass: 2>&1 | grep -q "BEGIN"
                  }

                  # Server drops the public cert into /etc/ai-sandbox-server/clients/.
                  test -f /etc/ai-sandbox-server/clients/alice-phone.crt

                  # Clean shutdown via SIGTERM (systemd KillSignal contract).
                  kill -TERM "$SERVER_PID"
                  for i in $(seq 1 30); do
                      kill -0 "$SERVER_PID" 2>/dev/null || break
                      sleep 1
                  done
                  if kill -0 "$SERVER_PID" 2>/dev/null; then
                      echo "FAIL: server did not exit within 30s of SIGTERM" >&2
                      kill -KILL "$SERVER_PID" 2>/dev/null || true
                      exit 1
                  fi
                  wait "$SERVER_PID" 2>/dev/null || true
                  echo ".deb install-flow smoke passed."
              '

      - name: Build bundled compose context on the host runner
        env:
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          set -euxo pipefail
          # AC29 sub-bullet d / pitfall mitigation — the bundled
          # SandboxDockerfile must build with host/ as its context. We
          # unzip on the GH runner (which has docker + compose-plugin
          # pre-installed) and run a full `compose build --no-cache`.
          # --project-directory MUST point at the unpacked host/ dir so
          # docker-compose.yml's `build.context: .` resolves to where
          # SandboxDockerfile actually lives (parity with AC25, which
          # invokes compose from the host/ bundle root).
          stage="$RUNNER_TEMP/install"
          install -d "$stage"
          unzip -q "$ZIP_PATH" -d "$stage"

          docker compose \
              -f "$stage/host/docker-compose.yml" \
              --project-directory "$stage/host" \
              build --no-cache claude-sandbox

      # UC06 § AC7 — verify entrypoint.sh's `cp -a /etc/claude-template/.
      # ~/.claude/` block runs exactly once per session (gated by
      # ~/.claude/.seeded) and treats an empty / absent template as a
      # no-op. We invoke the container with `true` as argv so it runs
      # the entrypoint, drops out of the `if [ "$#" -gt 0 ]` branch via
      # `exec "$@"`, and exits cleanly without launching tmux/claude.
      # Three cases: fresh start (template applies), restart (marker
      # blocks re-apply), no template at all (no-op).
      - name: Verify UC06 entrypoint.sh seeding logic
        env:
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          set -euxo pipefail

          # AC7 fresh-start case.
          template1="$RUNNER_TEMP/tpl-fresh"
          install -d -m 0755 "$template1"
          echo "SENTINEL_MARKER_FILE" > "$template1/marker-file"
          claude_config="$RUNNER_TEMP/cc-fresh"
          install -d -m 0777 "$claude_config"

          docker run --rm \
              -v "$template1:/etc/claude-template:ro" \
              -v "$claude_config:/home/claude/.claude" \
              ai-context:latest \
              true

          test -e "$claude_config/.seeded"
          test -f "$claude_config/marker-file"
          grep -q SENTINEL_MARKER_FILE "$claude_config/marker-file"

          # AC7 restart case — marker already present, new template
          # content must NOT propagate.
          template2="$RUNNER_TEMP/tpl-changed"
          install -d -m 0755 "$template2"
          echo "THIS_SHOULD_NOT_APPEAR" > "$template2/marker-file"

          docker run --rm \
              -v "$template2:/etc/claude-template:ro" \
              -v "$claude_config:/home/claude/.claude" \
              ai-context:latest \
              true

          ! grep -q THIS_SHOULD_NOT_APPEAR "$claude_config/marker-file"

          # AC7 no-template case — empty template bind-mount (or none)
          # leaves the session unchanged; no .seeded marker is written
          # because the seeding `if` short-circuits on the missing dir.
          claude_config_empty="$RUNNER_TEMP/cc-empty"
          install -d -m 0777 "$claude_config_empty"
          docker run --rm \
              -v "$claude_config_empty:/home/claude/.claude" \
              ai-context:latest \
              true

          [ ! -e "$claude_config_empty/.seeded" ]
