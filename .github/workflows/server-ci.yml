name: server-ci

on:
  pull_request:
    paths:
      - 'server/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/server-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless + tests + OAS generation
        run: ./gradlew :server:spotlessCheck :server:test :server:generateOpenApiDocs --no-daemon
      - name: Fail on drifted committed OAS
        run: git diff --exit-code -- server/openapi.yaml

  integration:
    runs-on: ubuntu-latest
    needs: build
    env:
      AI_SANDBOX_DIND: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testcontainers integration suite
        run: ./gradlew :server:integrationTest --no-daemon
