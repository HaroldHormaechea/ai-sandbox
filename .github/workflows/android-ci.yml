name: android-ci

# UC04 AC30 — every PR touching the Android module and every push to
# main runs lint + JVM unit tests + a debug APK + debug AAB build. We
# skip integration tests (`connectedAndroidTest`) since GitHub Actions
# runners don't ship an Android emulator and spinning one up doubles
# wall-clock time for marginal value while the project is in sideload.

on:
  pull_request:
    paths:
      - 'android/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        # android-actions/setup-android handles cmdline-tools install,
        # license acceptance, and platform / build-tools download in one
        # go. AGP 9.x picks up the SDK location from $ANDROID_HOME.
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache AGP transformed jars
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/transforms-3
            ~/.gradle/caches/transforms-4
          key: agp-transforms-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            agp-transforms-${{ runner.os }}-

      - name: Lint + unit tests + assemble debug
        # `lint` produces an XML report under android/build/reports/lint-results-debug.xml
        # `test` runs JUnit + Robolectric on the JVM (no emulator).
        # `assembleDebug` + `bundleDebug` confirm the AAB packaging path.
        run: |
          ./gradlew \
              :android:lint \
              :android:test \
              :android:assembleDebug \
              :android:bundleDebug \
              --no-daemon

      - name: Verify zero GMS dependencies (UC04 AC29)
        # Sideload-only target — ZXing was chosen over ML Kit precisely
        # to keep play-services-* out of the dep graph. CI catches any
        # regression that pulls one back in.
        run: |
          if ./gradlew :android:dependencies --no-daemon | grep -E 'com\.google\.android\.gms|play-services'; then
            echo "::error::play-services dependency detected — AC29 violated"
            exit 1
          fi

      - name: Verify no unqualified PKCS12 KeyStore call (UC13 AC6)
        # Every PKCS#12 import path in the Android module must name the
        # BouncyCastle provider explicitly:
        #     KeyStore.getInstance("PKCS12", "BC-ai-sandbox-client")
        # Calling `KeyStore.getInstance("PKCS12")` without the provider
        # argument silently routes through Android's stock PKCS12 stack,
        # which fails on PBES2 (PBKDF2 OID 1.2.840.113549.1.5.12) — the
        # exact bug UC13 closes. This grep is a negative test: it must
        # find ZERO hits, and exits non-zero if any single-arg call
        # creeps back in.
        run: |
          if grep -RnE 'KeyStore\.getInstance\("PKCS12"\s*\)' android/src/main/kotlin/; then
            echo "::error::Unqualified KeyStore.getInstance(\"PKCS12\") detected — UC13 AC6 requires the explicit \"BC-ai-sandbox-client\" provider argument"
            exit 1
          fi

      - name: Verify BouncyCastle survives in debug APK (UC13 AC13)
        # AC13 requires the BC provider classes to ship in the final
        # APK / AAB. We unzip the DEX files, run `strings`, and grep
        # for the BouncyCastleProvider type descriptor. Pure-grep so
        # there's no Android SDK dependency at this step.
        run: |
          # Intentionally NOT using `pipefail`: `grep -q` exits as soon
          # as it finds a match, which sends SIGPIPE to `unzip -p` and
          # makes pipefail return the unzip exit code (141), which would
          # invert through `if !` into a false-positive error. Without
          # pipefail the pipeline's exit is grep's (the rightmost stage),
          # which is exactly what we want.
          set -eu
          apk="$(ls android/build/outputs/apk/debug/*.apk | head -1)"
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo "::error::Debug APK not found under android/build/outputs/apk/debug/"
            exit 1
          fi
          if ! unzip -p "$apk" 'classes*.dex' | strings | grep -q 'Lorg/bouncycastle/jce/provider/BouncyCastleProvider;'; then
            echo "::error::BouncyCastleProvider descriptor not found in $apk DEX — UC13 AC13 violated"
            exit 1
          fi
          echo "AC13 APK check OK: BouncyCastleProvider descriptor present in $apk"

      - name: Verify BouncyCastle survives in debug AAB (UC13 AC13)
        # AAB packaging stores DEX under base/dex/. We also cross-check
        # the Maven coordinate in the AAB's dependency-info protobuf as
        # forward defence in case a future shrinker variant rewrites
        # descriptors but leaves dependency-info intact.
        run: |
          # See AC13 APK step above for the no-pipefail rationale.
          set -eu
          aab="$(ls android/build/outputs/bundle/debug/*.aab | head -1)"
          if [ -z "$aab" ] || [ ! -f "$aab" ]; then
            echo "::error::Debug AAB not found under android/build/outputs/bundle/debug/"
            exit 1
          fi
          if ! unzip -p "$aab" 'base/dex/*.dex' | strings | grep -q 'Lorg/bouncycastle/jce/provider/BouncyCastleProvider;'; then
            echo "::error::BouncyCastleProvider descriptor not found in $aab base/dex/*.dex — UC13 AC13 violated"
            exit 1
          fi
          if ! unzip -p "$aab" BUNDLE-METADATA/com.android.tools.build.libraries/dependencies.pb | strings | grep -q 'bcprov-jdk18on'; then
            echo "::error::bcprov-jdk18on coordinate missing from $aab dependencies.pb — UC13 AC13 cross-check failed"
            exit 1
          fi
          echo "AC13 AAB check OK: BouncyCastleProvider descriptor + bcprov-jdk18on coord present in $aab"

      - name: Upload lint XML report
        # Always upload even on failure so reviewers can pull the report
        # without re-running the job.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
