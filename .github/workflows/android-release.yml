name: android-release

# UC04 AC31 — push tag `android-vX.Y.Z` → build signed release artifacts
# (APK + AAB) → publish them as GitHub Release assets. Distribution is
# sideload-only (no Play Store); the partner installs the APK by hand.
#
# Required repo secrets:
#   RELEASE_ANDROID_SIGNATURE_KEYSTORE_FILE      — base64-encoded keystore.jks
#   RELEASE_ANDROID_SIGNATURE_KEYSTORE_PASSWORD  — keystore password
#   RELEASE_ANDROID_SIGNATURE_KEY_ALIAS          — signing-key alias (default 'ai-sandbox')
#   RELEASE_ANDROID_SIGNATURE_KEY_PASSWORD       — signing-key password
#
# The keystore lands on tmpfs (`/dev/shm`) so it never touches the
# runner's persistent disk. The secret can be re-rolled by regenerating
# the JKS, base64-encoding it, and updating the secret value — no code
# change required.

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: ver
        # tag form: android-vX.Y.Z[-suffix]; the suffix flows through
        # into Gradle's versionName so 'android-v0.1.0-rc1' produces a
        # release with versionName 0.1.0-rc1.
        run: |
          tag="${GITHUB_REF##*/}"
          v="${tag#android-v}"
          # versionCode is monotonic; use the GitHub run number so
          # parallel branches can't collide. operator can override by
          # passing -Pai_sandbox_android_version_code=NNN.
          echo "version=$v"   >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore to tmpfs
        env:
          KEYSTORE_FILE: ${{ secrets.RELEASE_ANDROID_SIGNATURE_KEYSTORE_FILE }}
        # /dev/shm is RAM-backed on every Linux runner; the keystore
        # never touches the runner's persistent disk. Removed on job
        # tear-down regardless of success.
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "::error::RELEASE_ANDROID_SIGNATURE_KEYSTORE_FILE secret is empty"
            exit 1
          fi
          mkdir -p /dev/shm/ai-sandbox-release
          chmod 700 /dev/shm/ai-sandbox-release
          printf '%s' "$KEYSTORE_FILE" | base64 -d > /dev/shm/ai-sandbox-release/keystore.jks
          chmod 600 /dev/shm/ai-sandbox-release/keystore.jks
          echo "KEYSTORE_FILE_PATH=/dev/shm/ai-sandbox-release/keystore.jks" >> "$GITHUB_ENV"

      - name: Assemble signed APK + AAB
        env:
          # The build.gradle.kts signing-config block reads these env
          # vars directly — see android/build.gradle.kts.
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_ANDROID_SIGNATURE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_ANDROID_SIGNATURE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_ANDROID_SIGNATURE_KEY_PASSWORD }}
        run: |
          ./gradlew \
              -Pai_sandbox_android_version_name=${{ steps.ver.outputs.version }} \
              -Pai_sandbox_android_version_code=${{ steps.ver.outputs.code }} \
              :android:assembleRelease :android:bundleRelease \
              --no-daemon

      - name: Locate release artifacts
        id: artifacts
        run: |
          apk="$(ls android/build/outputs/apk/release/*-release*.apk | head -1)"
          aab="$(ls android/build/outputs/bundle/release/*-release*.aab | head -1)"
          if [ -z "$apk" ] || [ -z "$aab" ]; then
            echo "::error::Could not find APK or AAB"; ls -R android/build/outputs || true; exit 1
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

      - name: Verify BouncyCastle survives in release APK (UC13 AC13)
        # AC13 requires the BC provider classes to ship in the final
        # release APK. Pure unzip+strings+grep — no Android SDK needed.
        run: |
          # Intentionally NOT using `pipefail`: `grep -q` exits early
          # on match → SIGPIPE → unzip exit 141 → pipefail would return
          # non-zero → `if !` would invert into a false-positive error.
          set -eu
          apk="${{ steps.artifacts.outputs.apk }}"
          if ! unzip -p "$apk" 'classes*.dex' | strings | grep -q 'Lorg/bouncycastle/jce/provider/BouncyCastleProvider;'; then
            echo "::error::BouncyCastleProvider descriptor not found in $apk DEX — UC13 AC13 violated"
            exit 1
          fi
          echo "AC13 release APK check OK: BouncyCastleProvider descriptor present in $apk"

      - name: Verify BouncyCastle survives in release AAB (UC13 AC13)
        # The primary AC13 evidence is the BC type descriptor surviving
        # in the base DEX (R8 is currently off — `isMinifyEnabled = false`
        # — so the ProGuard keep-rules are forward-defence; nothing
        # should be shrinking BC out). The BUNDLE-METADATA Maven-coord
        # cross-check is intentionally omitted: AGP does not reliably
        # emit `dependencies.pb` for unminified release bundles, and
        # making it conditional on the build variant adds maintenance
        # cost for marginal forward-defence value. If R8 is ever turned
        # on for release, revisit this step to add the cross-check
        # under that variant only.
        run: |
          # See AC13 release APK step above for the no-pipefail rationale.
          set -eu
          aab="${{ steps.artifacts.outputs.aab }}"
          if ! unzip -p "$aab" 'base/dex/*.dex' | strings | grep -q 'Lorg/bouncycastle/jce/provider/BouncyCastleProvider;'; then
            echo "::error::BouncyCastleProvider descriptor not found in $aab base/dex/*.dex — UC13 AC13 violated"
            exit 1
          fi
          echo "AC13 release AAB check OK: BouncyCastleProvider descriptor present in $aab"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ai-sandbox-android ${{ steps.ver.outputs.version }}
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.aab }}
          fail_on_unmatched_files: true
          # UC13 AC10 — prepend release-notes body with the BC integration
          # callout; `generate_release_notes: true` appends the auto-generated
          # commit / PR list after this body. The text below records (a) the
          # new Android-side BC dependency, (b) the unchanged server crypto,
          # and (c) the explicit reasoning for the asymmetric fix.
          generate_release_notes: true
          body: |
            ## Crypto provider change (UC13)

            This release adds **BouncyCastle (`bcprov-jdk18on:1.79`)** as a
            new Android-side dependency. It is registered at process start
            under the distinct provider name `BC-ai-sandbox-client` (so the
            Android-stock `"BC"` provider remains untouched) and is used
            exclusively for the PKCS#12 enrollment-cert import unwrap.
            TLS continues through Conscrypt for hardware-accelerated
            AES/AEAD — BC is **not** in the TLS path.

            **Server crypto is unchanged.** The server's
            `KeyStore.getInstance("PKCS12")` emission stays on modern
            PBES2 (PBKDF2-HMAC-SHA256 + AES-256, the JDK 21 default since
            Java 14+).

            Why the asymmetric fix: server stays on modern PBKDF2-AES;
            Android gets the real BC because Conscrypt's stock provider
            doesn't recognize the bare PBKDF2 OID `1.2.840.113549.1.5.12`
            during private-key unwrap. The alternative — regressing the
            server to legacy PKCS#12 v1 (SHA1+3DES) — was rejected on
            crypto-strength grounds (3DES is FIPS-deprecated and SHA1's
            collision posture is well-known).

      - name: Wipe keystore from tmpfs
        # Defence in depth — runners are ephemeral, but explicit cleanup
        # is cheap and avoids ever exposing the JKS in any post-job log.
        if: always()
        run: rm -rf /dev/shm/ai-sandbox-release || true
