name: android-gate-smoke

# UC-85 (AC-8, Step 1) — the go/no-go smoke job for emulator-in-CI.
#
# This deliberately does the MINIMUM needed to prove the deterministic gate's
# hardest precondition on the ACTUAL GitHub-hosted runner: that /dev/kvm is
# present (hardware acceleration), that a headless emulator boots, and that it
# reaches `sys.boot_completed=1`. It runs NO app, NO server, and NONE of the
# instrumented gate suite — that is the full gate job (android-gate.yml, Step 2),
# which is wired only AFTER this smoke job is confirmed green on the branch.
#
# If a runner reports KVM absent, the job FAILS loudly (rather than silently
# falling back to a software-rendered emulator, which is too slow/flaky to gate
# on) so we know to switch to a KVM-capable runner — see the checkpoint report.

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/uc-85-deterministic-llm-free-functional-gate'
    paths:
      - '.github/workflows/android-gate-smoke.yml'

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # reactivecircus/android-emulator-runner needs the KVM device group opened
      # up to the runner user; this is the documented enable-KVM incantation.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Report /dev/kvm presence (go/no-go)
        id: kvm
        run: |
          set -eu
          if [ -e /dev/kvm ]; then
            present=true
            detail="$(ls -l /dev/kvm)"
          else
            present=false
            detail="/dev/kvm is ABSENT on this runner"
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          {
            echo "## Android gate smoke — /dev/kvm probe"
            echo ""
            echo "- runner: \`${{ runner.os }}\` on \`ubuntu-latest\`"
            echo "- /dev/kvm present: \`$present\`"
            echo "- detail: \`$detail\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "kvm present=$present ($detail)"
          if [ "$present" != "true" ]; then
            echo "::error::/dev/kvm absent — hardware-accelerated emulator unavailable. Switch to a KVM-capable runner (the software-render fallback is too slow/flaky to gate on)."
            exit 1
          fi

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platform-tools'

      - name: Boot emulator + assert sys.boot_completed
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # AC-10 emulator-reliability flags: no window/audio/snapshot/boot-anim,
          # software GL fallback for the host, animations disabled — the same taming
          # the real gate uses so launcher/SystemUI ANRs are out of the boot path.
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -noaudio -no-metrics -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            echo "boot_completed=$(adb shell getprop sys.boot_completed | tr -d '\r')"
            booted="$(adb shell getprop sys.boot_completed | tr -d '\r')"
            if [ "$booted" != "1" ]; then
              echo "::error::emulator did not report sys.boot_completed=1"
              exit 1
            fi
            # AC-10 — confirm we can also disable animation scales at runtime (the
            # same calls the full gate makes), so the gate's ANR mitigation is proven here.
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb shell settings put secure anr_show_dialog 0 || true
            echo "emulator-in-CI smoke OK: /dev/kvm present, emulator booted, sys.boot_completed=1"
